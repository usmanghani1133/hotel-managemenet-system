name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Lint Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: hotelflow/package-lock.json

      - name: Install dependencies
        working-directory: ./hotelflow
        run: npm ci

      - name: Run code linter
        working-directory: ./hotelflow
        run: npm run lint

      - name: Run production build
        working-directory: ./hotelflow
        run: npm run build
